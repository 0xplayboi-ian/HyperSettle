<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_90_a" x1="50.0%" y1="0.0%" x2="50.0%" y2="100.0%">
            <stop offset="0%" stop-color="#FF007A"/>
            <stop offset="33%" stop-color="#7928CA"/>
            <stop offset="66%" stop-color="#0070F3"/>
            <stop offset="100%" stop-color="#00F5A0"/>
        </linearGradient>
        <linearGradient id="grad_90_b" x1="100.0%" y1="50.0%" x2="0.0%" y2="50.0%">
            <stop offset="0%" stop-color="#00F5A0"/>
            <stop offset="33%" stop-color="#0070F3"/>
            <stop offset="66%" stop-color="#7928CA"/>
            <stop offset="100%" stop-color="#FF007A"/>
        </linearGradient>
        <radialGradient id="bgGlow_90" cx="50%" cy="50%" r="65%">
            <stop offset="0%" stop-color="#0E1E1C" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#040608" stop-opacity="1.0"/>
        </radialGradient>
    </defs>
    <!-- Background Frame -->
    <rect width="512" height="512" rx="36" fill="url(#bgGlow_90)"/>
    <rect width="512" height="512" rx="36" fill="none" stroke="#1F2E2B" stroke-width="1.5"/>
    
    <!-- Vector Mark -->
    
            <g transform="translate(256,256) rotate(90)">
                <!-- S-Wave Backbone -->
                <path d="M 80 -120 C -40 -120 -80 -40 0 0 C 80 40 40 120 -80 120" 
                      fill="none" stroke="url(#grad_90_a)" stroke-width="32" stroke-linecap="round"/>
                <!-- Intersecting H-Pillar Left -->
                <path d="M -90 -140 L -90 140" 
                      fill="none" stroke="url(#grad_90_b)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
                <!-- Intersecting H-Pillar Right -->
                <path d="M 90 -140 L 90 140" 
                      fill="none" stroke="url(#grad_90_b)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
                <!-- Accent Glowing Dots -->
                <circle cx="80" cy="-120" r="16" fill="#FFFFFF"/>
                <circle cx="-80" cy="120" r="16" fill="#98FCE4"/>
            </g>
</svg>